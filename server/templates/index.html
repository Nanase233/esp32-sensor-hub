<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 IMU 实时数据监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-box .value {
            font-size: 2em;
            font-weight: bold;
        }

        .axis-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .axis-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid;
        }

        .axis-box.ax { border-color: #ff6b6b; }
        .axis-box.ay { border-color: #4ecdc4; }
        .axis-box.az { border-color: #45b7d1; }

        .axis-box .label {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .axis-box.ax .label { color: #ff6b6b; }
        .axis-box.ay .label { color: #4ecdc4; }
        .axis-box.az .label { color: #45b7d1; }

        .axis-box .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .axis-box .unit {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status.connected {
            background: #51cf66;
            color: white;
        }

        .status.disconnected {
            background: #ff6b6b;
            color: white;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        /* 求助面板样式 */
        .help-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .help-item.status-pending { border-left-color: #ffa726; }
        .help-item.status-responded { border-left-color: #66bb6a; }
        .help-item.status-cancelled { border-left-color: #ef5350; }

        .help-info { flex: 1; }
        .help-info .help-msg { font-weight: bold; color: #333; margin-bottom: 5px; }
        .help-info .help-meta { font-size: 0.85em; color: #666; }

        .help-actions { display: flex; gap: 8px; }

        .help-actions button {
            padding: 6px 14px;
            font-size: 0.85em;
            border-radius: 4px;
        }

        .btn-respond {
            background: linear-gradient(135deg, #66bb6a, #43a047) !important;
        }

        .btn-cancel {
            background: linear-gradient(135deg, #ef5350, #e53935) !important;
        }

        .help-status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
        }

        .badge-pending { background: #ffa726; }
        .badge-responded { background: #66bb6a; }
        .badge-cancelled { background: #ef5350; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ESP32-S3 IMU 实时数据监控</h1>

        <!-- 状态和控制 -->
        <div class="card">
            <div class="controls">
                <span id="status" class="status disconnected">未连接</span>
                <button onclick="toggleAutoRefresh()">
                    <span id="refreshBtn">开启自动刷新</span>
                </button>
                <button onclick="collectOnce()">采集一次最新数据</button>
                <button onclick="refreshHistory()">刷新已存数据</button>
                <button onclick="clearChart()">清空图表</button>
            </div>
            <p style="color: #666; font-size: 0.9em;">
                提示：「采集一次最新数据」会触发设备重新采集并回传；「刷新已存数据」仅读取数据库旧值
            </p>
        </div>

        <!-- 采集任务列表 -->
        <div class="card">
            <h2>📋 采集任务</h2>
            <div id="task-list">
                <p style="color: #999;">暂无任务</p>
            </div>
        </div>

        <!-- 求助请求面板 -->
        <div class="card">
            <h2>🆘 求助请求</h2>
            <div id="help-list">
                <p style="color: #999;">暂无求助请求</p>
            </div>
        </div>

        <!-- 实时数据 -->
        <div class="card">
            <h2>📊 实时加速度数据</h2>
            <div class="axis-display">
                <div class="axis-box ax">
                    <div class="label">X 轴</div>
                    <div class="value" id="ax-value">0.0000</div>
                    <div class="unit">m/s²</div>
                </div>
                <div class="axis-box ay">
                    <div class="label">Y 轴</div>
                    <div class="value" id="ay-value">0.0000</div>
                    <div class="unit">m/s²</div>
                </div>
                <div class="axis-box az">
                    <div class="label">Z 轴</div>
                    <div class="value" id="az-value">0.0000</div>
                    <div class="unit">m/s²</div>
                </div>
            </div>
            <p style="color: #999; font-size: 0.9em;">
                更新时间: <span id="update-time">--</span>
            </p>
        </div>

        <!-- 统计信息 -->
        <div class="card">
            <h2>📈 数据统计</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">总记录数</div>
                    <div class="value" id="total-records">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">最新记录</div>
                    <div class="value" id="latest-time" style="font-size: 1em;">--</div>
                </div>
                <div class="stat-box">
                    <div class="label">采样率</div>
                    <div class="value" id="sample-rate">0</div>
                    <div class="label">Hz</div>
                </div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="card">
            <h2>📉 历史数据趋势</h2>
            <div class="chart-container">
                <canvas id="imuChart"></canvas>
            </div>
        </div>

        <div class="footer">
            <p>ESP32-S3-EYE IMU 数据采集系统 | QMA7981 加速度计</p>
        </div>
    </div>

    <script>
        // 图表配置
        const ctx = document.getElementById('imuChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'X 轴',
                        data: [],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: false
                    },
                    {
                        label: 'Y 轴',
                        data: [],
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        tension: 0.4,
                        fill: false
                    },
                    {
                        label: 'Z 轴',
                        data: [],
                        borderColor: '#45b7d1',
                        backgroundColor: 'rgba(69, 183, 209, 0.1)',
                        tension: 0.4,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 0
                },
                scales: {
                    x: {
                        display: true,
                        title: {
                            display: true,
                            text: '时间'
                        }
                    },
                    y: {
                        display: true,
                        title: {
                            display: true,
                            text: '加速度 (m/s²)'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                }
            }
        });

        let autoRefresh = false;
        let refreshInterval = null;
        let dataCount = 0;
        let lastTimestamp = 0;

        // 更新实时数据
        async function updateData() {
            try {
                const response = await fetch('/api/imu/latest');
                if (response.ok) {
                    const data = await response.json();

                    // 更新数值显示
                    document.getElementById('ax-value').textContent = data.ax.toFixed(4);
                    document.getElementById('ay-value').textContent = data.ay.toFixed(4);
                    document.getElementById('az-value').textContent = data.az.toFixed(4);
                    document.getElementById('update-time').textContent = data.created_at;

                    // 更新状态
                    document.getElementById('status').textContent = '已连接';
                    document.getElementById('status').className = 'status connected';

                    // 更新图表
                    const timeLabel = new Date(data.timestamp * 1000).toLocaleTimeString();
                    chart.data.labels.push(timeLabel);
                    chart.data.datasets[0].data.push(data.ax);
                    chart.data.datasets[1].data.push(data.ay);
                    chart.data.datasets[2].data.push(data.az);

                    // 保持最多 50 个数据点
                    if (chart.data.labels.length > 50) {
                        chart.data.labels.shift();
                        chart.data.datasets.forEach(dataset => dataset.data.shift());
                    }

                    chart.update();

                    // 计算采样率
                    if (lastTimestamp > 0) {
                        const deltaTime = data.timestamp - lastTimestamp;
                        if (deltaTime > 0) {
                            const sampleRate = 1000000 / deltaTime; // 转换为 Hz
                            document.getElementById('sample-rate').textContent = sampleRate.toFixed(1);
                        }
                    }
                    lastTimestamp = data.timestamp;

                    dataCount++;
                } else {
                    document.getElementById('status').textContent = '未连接';
                    document.getElementById('status').className = 'status disconnected';
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                document.getElementById('status').textContent = '错误';
                document.getElementById('status').className = 'status disconnected';
            }
        }

        // 更新统计信息
        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('total-records').textContent = stats.total_records;
                    document.getElementById('latest-time').textContent = stats.latest_record || '--';
                }
            } catch (error) {
                console.error('获取统计失败:', error);
            }
        }

        // 切换自动刷新
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('refreshBtn');

            if (autoRefresh) {
                btn.textContent = '停止自动刷新';
                refreshInterval = setInterval(() => {
                    updateData();
                    updateStats();
                }, 1000); // 每秒刷新
            } else {
                btn.textContent = '开启自动刷新';
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
            }
        }

        // 清空图表
        function clearChart() {
            chart.data.labels = [];
            chart.data.datasets.forEach(dataset => dataset.data = []);
            chart.update();
        }

        // 初始加载
        updateData();
        updateStats();
        updateTaskList();
        updateHelpList();

        // 每 5 秒更新统计、任务列表和求助列表
        setInterval(updateStats, 5000);
        setInterval(updateTaskList, 2000);
        setInterval(updateHelpList, 2000);

        // ==================== 远程采集功能 ====================

        // 采集一次最新数据
        async function collectOnce() {
            try {
                const resp = await fetch('/api/collect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({sensor: 'imu'})
                });
                if (resp.ok) {
                    const result = await resp.json();
                    const rid = result.request_id;
                    console.log('创建采集任务:', rid);

                    // 轮询任务状态直到完成或超时
                    pollTaskStatus(rid);
                } else {
                    alert('创建任务失败');
                }
            } catch (e) {
                console.error('采集请求失败:', e);
                alert('网络错误');
            }
        }

        // 轮询任务状态
        function pollTaskStatus(requestId) {
            let attempts = 0;
            const maxAttempts = 20; // 最多轮询 20 次（约 20 秒）

            const timer = setInterval(async () => {
                attempts++;
                try {
                    const resp = await fetch(`/api/collect/${requestId}`);
                    if (resp.ok) {
                        const task = await resp.json();
                        updateTaskList();

                        if (['completed', 'failed', 'timeout'].includes(task.status)) {
                            clearInterval(timer);
                            if (task.status === 'completed' && task.data) {
                                // 更新图表显示新数据
                                const timeLabel = new Date().toLocaleTimeString();
                                chart.data.labels.push(timeLabel + ' (采集)');
                                chart.data.datasets[0].data.push(task.data.ax);
                                chart.data.datasets[1].data.push(task.data.ay);
                                chart.data.datasets[2].data.push(task.data.az);
                                if (chart.data.labels.length > 50) {
                                    chart.data.labels.shift();
                                    chart.data.datasets.forEach(ds => ds.data.shift());
                                }
                                chart.update();
                            }
                        }
                    }
                } catch (e) {
                    console.error('轮询失败:', e);
                }

                if (attempts >= maxAttempts) {
                    clearInterval(timer);
                }
            }, 1000);
        }

        // 刷新已存数据（仅读取数据库）
        async function refreshHistory() {
            await updateData();
            updateTaskList();
        }

        // 更新任务列表
        async function updateTaskList() {
            try {
                const resp = await fetch('/api/tasks?limit=10');
                if (resp.ok) {
                    const result = await resp.json();
                    const container = document.getElementById('task-list');

                    if (result.tasks.length === 0) {
                        container.innerHTML = '<p style="color: #999;">暂无任务</p>';
                        return;
                    }

                    const statusIcon = {
                        'pending': '⏳',
                        'sent': '📡',
                        'received': '📥',
                        'completed': '✅',
                        'failed': '',
                        'timeout': '⏰'
                    };

                    let html = '<table style="width:100%; border-collapse: collapse; font-size: 0.9em;">';
                    html += '<tr style="border-bottom: 2px solid #eee;">';
                    html += '<th style="padding:8px; text-align:left;">Request ID</th>';
                    html += '<th style="padding:8px; text-align:left;">状态</th>';
                    html += '<th style="padding:8px; text-align:left;">传感器</th>';
                    html += '<th style="padding:8px; text-align:left;">创建时间</th>';
                    html += '<th style="padding:8px; text-align:left;">数据</th>';
                    html += '</tr>';

                    result.tasks.forEach(t => {
                        const icon = statusIcon[t.status] || '?';
                        const time = t.created_at ? new Date(t.created_at * 1000).toLocaleTimeString() : '--';
                        const dataStr = t.status === 'completed' ? '✅ 已回传' : (t.error_msg || '--');
                        html += `<tr style="border-bottom: 1px solid #eee;">`;
                        html += `<td style="padding:8px; font-family: monospace;">${t.request_id}</td>`;
                        html += `<td style="padding:8px;">${icon} ${t.status}</td>`;
                        html += `<td style="padding:8px;">${t.sensor}</td>`;
                        html += `<td style="padding:8px;">${time}</td>`;
                        html += `<td style="padding:8px;">${dataStr}</td>`;
                        html += `</tr>`;
                    });

                    html += '</table>';
                    container.innerHTML = html;
                }
            } catch (e) {
                console.error('获取任务列表失败:', e);
            }
        }

        // ==================== 求助请求功能 ====================

        // 更新求助请求列表
        async function updateHelpList() {
            try {
                const resp = await fetch('/api/help');
                if (resp.ok) {
                    const result = await resp.json();
                    const container = document.getElementById('help-list');

                    if (result.requests.length === 0) {
                        container.innerHTML = '<p style="color: #999;">暂无求助请求</p>';
                        return;
                    }

                    const statusText = {
                        'pending': '等待回应',
                        'responded': '已回应',
                        'cancelled': '已取消'
                    };

                    const badgeClass = {
                        'pending': 'badge-pending',
                        'responded': 'badge-responded',
                        'cancelled': 'badge-cancelled'
                    };

                    let html = '';
                    result.requests.forEach(req => {
                        const time = req.created_at ? new Date(req.created_at * 1000).toLocaleString() : '--';
                        const badge = `<span class="help-status-badge ${badgeClass[req.status] || ''}">${statusText[req.status] || req.status}</span>`;

                        html += `<div class="help-item status-${req.status}">`;
                        html += `<div class="help-info">`;
                        html += `<div class="help-msg">${req.message}</div>`;
                        html += `<div class="help-meta">设备: ${req.device_id || '未知'} | 时间: ${time} | ID: ${req.request_id}</div>`;
                        if (req.status === 'responded' && req.response_msg) {
                            html += `<div class="help-meta" style="color: #43a047;">回应: ${req.response_msg}</div>`;
                        }
                        html += `</div>`;
                        html += `<div class="help-actions">`;
                        html += badge;
                        if (req.status === 'pending') {
                            html += `<button class="btn-respond" onclick="respondHelp('${req.request_id}')">回应</button>`;
                            html += `<button class="btn-cancel" onclick="cancelHelp('${req.request_id}')">取消</button>`;
                        }
                        html += `</div>`;
                        html += `</div>`;
                    });

                    container.innerHTML = html;
                }
            } catch (e) {
                console.error('获取求助列表失败:', e);
            }
        }

        // 回应求助请求
        async function respondHelp(requestId) {
            const msg = prompt('请输入回应内容:', '收到，马上来！');
            if (msg === null) return; // 用户取消

            try {
                const resp = await fetch(`/api/help/${requestId}/respond`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({response_msg: msg})
                });
                if (resp.ok) {
                    alert('已回应求助请求');
                    updateHelpList();
                } else {
                    alert('回应失败');
                }
            } catch (e) {
                console.error('回应失败:', e);
                alert('网络错误');
            }
        }

        // 取消求助请求
        async function cancelHelp(requestId) {
            if (!confirm('确定要取消此求助请求吗？')) return;

            try {
                const resp = await fetch(`/api/help/${requestId}/cancel`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                if (resp.ok) {
                    alert('已取消求助请求');
                    updateHelpList();
                } else {
                    alert('取消失败');
                }
            } catch (e) {
                console.error('取消失败:', e);
                alert('网络错误');
            }
        }
    </script>
</body>
</html>
