<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 IMU 实时数据监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ===== 顶部导航栏 ===== */
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #f8fafc;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status.connected { background: #064e3b; color: #6ee7b7; }
        .status.disconnected { background: #7f1d1d; color: #fca5a5; }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.connected .status-dot { background: #6ee7b7; }
        .status.disconnected .status-dot { background: #fca5a5; }

        /* ===== 主网格布局 ===== */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .col-left { display: flex; flex-direction: column; gap: 16px; }
        .col-right { display: flex; flex-direction: column; gap: 16px; }

        /* ===== 卡片 ===== */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.85em;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon { font-size: 1.1em; }

        /* ===== 实时数据大数字 ===== */
        .axis-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .axis-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px 16px;
            text-align: center;
        }

        .axis-box .label {
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .axis-box.ax .label { color: #f87171; }
        .axis-box.ay .label { color: #2dd4bf; }
        .axis-box.az .label { color: #60a5fa; }

        .axis-box .value {
            font-size: 2.2em;
            font-weight: 700;
            color: #f1f5f9;
            font-variant-numeric: tabular-nums;
        }

        .axis-box .unit {
            font-size: 0.75em;
            color: #64748b;
            margin-top: 4px;
        }

        .update-time {
            font-size: 0.8em;
            color: #64748b;
            margin-top: 12px;
        }

        /* ===== 图表 ===== */
        .chart-container {
            position: relative;
            height: 320px;
        }

        /* ===== 统计小卡片 ===== */
        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-box .label {
            font-size: 0.8em;
            color: #94a3b8;
        }

        .stat-box .value {
            font-size: 1.3em;
            font-weight: 700;
            color: #f1f5f9;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 控制按钮 ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.15s;
        }

        button:hover {
            background: #475569;
            border-color: #64748b;
        }

        button:active { transform: scale(0.97); }

        .btn-primary {
            background: #3b82f6;
            border-color: #2563eb;
            color: white;
        }

        .btn-primary:hover { background: #2563eb; }

        .btn-success {
            background: #059669;
            border-color: #047857;
            color: white;
        }

        .btn-success:hover { background: #047857; }

        .btn-danger {
            background: #dc2626;
            border-color: #b91c1c;
            color: white;
        }

        .btn-danger:hover { background: #b91c1c; }

        /* ===== 列表项（任务 / 求助） ===== */
        .list-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
        }

        .list-item:last-child { margin-bottom: 0; }

        .list-item .item-info { flex: 1; }
        .list-item .item-main { font-weight: 600; color: #f1f5f9; margin-bottom: 3px; }
        .list-item .item-meta { font-size: 0.85em; color: #64748b; }

        .list-item .item-actions { display: flex; gap: 6px; }
        .list-item .item-actions button { padding: 4px 10px; font-size: 0.8em; }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge-pending { background: #92400e; color: #fcd34d; }
        .badge-responded { background: #064e3b; color: #6ee7b7; }
        .badge-cancelled { background: #7f1d1d; color: #fca5a5; }
        .badge-completed { background: #064e3b; color: #6ee7b7; }
        .badge-failed { background: #7f1d1d; color: #fca5a5; }
        .badge-timeout { background: #92400e; color: #fcd34d; }

        .empty-text { color: #475569; font-size: 0.85em; text-align: center; padding: 20px 0; }

        /* ===== 自然语言助手（底部全宽） ===== */
        .nl-full {
            grid-column: 1 / -1;
        }

        .nl-chat-container { display: flex; flex-direction: column; gap: 10px; }

        .nl-chat-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            max-height: 260px;
            overflow-y: auto;
        }

        .nl-message {
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .nl-message.user {
            background: #1e3a5f;
            color: #e2e8f0;
            margin-left: 40px;
            text-align: right;
            border: 1px solid #2563eb;
        }

        .nl-message.assistant {
            background: #064e3b;
            color: #d1fae5;
            margin-right: 40px;
            border: 1px solid #059669;
        }

        .nl-message.error {
            background: #7f1d1d;
            color: #fecaca;
            margin-right: 40px;
            border: 1px solid #dc2626;
        }

        .nl-message .meta {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 4px;
        }

        .nl-input-row { display: flex; gap: 8px; }

        .nl-input-row input {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.9em;
            outline: none;
        }

        .nl-input-row input:focus { border-color: #3b82f6; }

        .nl-input-row button { white-space: nowrap; }

        .nl-examples { display: flex; flex-wrap: wrap; gap: 6px; }

        .nl-examples button {
            background: #334155 !important;
            border-color: #475569 !important;
            padding: 4px 12px !important;
            font-size: 0.8em !important;
            border-radius: 15px !important;
        }

        .nl-examples button:hover { background: #475569 !important; }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.8em;
            padding: 16px;
            grid-column: 1 / -1;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="topbar">
        <div class="topbar-title">ESP32-S3 IMU 实时监控</div>
        <div class="topbar-right">
            <span id="status" class="status disconnected"><span class="status-dot"></span>未连接</span>
        </div>
    </div>

    <!-- 主仪表盘 -->
    <div class="dashboard">
        <!-- 左列 -->
        <div class="col-left">
            <!-- 实时数据 -->
            <div class="card">
                <div class="card-title"><span class="icon">📊</span> 实时加速度</div>
                <div class="axis-display">
                    <div class="axis-box ax">
                        <div class="label">X 轴</div>
                        <div class="value" id="ax-value">0.0000</div>
                        <div class="unit">m/s²</div>
                    </div>
                    <div class="axis-box ay">
                        <div class="label">Y 轴</div>
                        <div class="value" id="ay-value">0.0000</div>
                        <div class="unit">m/s²</div>
                    </div>
                    <div class="axis-box az">
                        <div class="label">Z 轴</div>
                        <div class="value" id="az-value">0.0000</div>
                        <div class="unit">m/s²</div>
                    </div>
                </div>
                <div class="update-time">更新: <span id="update-time">--</span></div>
            </div>

            <!-- 图表 -->
            <div class="card">
                <div class="card-title"><span class="icon"></span> 历史趋势</div>
                <div class="chart-container">
                    <canvas id="imuChart"></canvas>
                </div>
            </div>

            <!-- 自然语言助手 -->
            <div class="card nl-full">
                <div class="card-title"><span class="icon">🤖</span> 自然语言助手</div>
                <div class="nl-chat-container">
                    <div class="nl-chat-box" id="nl-chat-box">
                        <div class="nl-message assistant">
                            你好！我可以帮你查询传感器数据或请求重新采集。
                            <div class="meta">来源：系统 | 状态：就绪</div>
                        </div>
                    </div>
                    <div class="nl-input-row">
                        <input type="text" id="nl-input" placeholder="输入请求，如：查看上次数据 / 重新采集一次" onkeydown="if(event.key==='Enter')sendNlQuery()">
                        <button class="btn-primary" onclick="sendNlQuery()">发送</button>
                    </div>
                    <div class="nl-examples">
                        <button onclick="quickNl('查看上次数据')">查看上次数据</button>
                        <button onclick="quickNl('重新采集一次')">重新采集一次</button>
                        <button onclick="quickNl('最近一次加速度是多少')">最近加速度</button>
                        <button onclick="quickNl('今天天气如何')">越界测试</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右列 -->
        <div class="col-right">
            <!-- 控制 -->
            <div class="card">
                <div class="card-title"><span class="icon">🎛️</span> 控制</div>
                <div class="controls">
                    <button onclick="toggleAutoRefresh()"><span id="refreshBtn">自动刷新</span></button>
                    <button class="btn-primary" onclick="collectOnce()">采集一次</button>
                    <button onclick="refreshHistory()">刷新数据</button>
                    <button onclick="clearChart()">清空图表</button>
                </div>
            </div>

            <!-- 统计 -->
            <div class="card">
                <div class="card-title"><span class="icon">📈</span> 统计</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="label">总记录数</span>
                        <span class="value" id="total-records">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">最新记录</span>
                        <span class="value" id="latest-time" style="font-size:0.9em;">--</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">采样率</span>
                        <span class="value" id="sample-rate">0 <small style="font-size:0.6em;color:#64748b;">Hz</small></span>
                    </div>
                </div>
            </div>

            <!-- 采集任务 -->
            <div class="card">
                <div class="card-title"><span class="icon"></span> 采集任务</div>
                <div id="task-list">
                    <div class="empty-text">暂无任务</div>
                </div>
            </div>

            <!-- 求助请求 -->
            <div class="card">
                <div class="card-title"><span class="icon">🆘</span> 求助请求</div>
                <div id="help-list">
                    <div class="empty-text">暂无求助请求</div>
                </div>
            </div>
        </div>

        <div class="footer">ESP32-S3-EYE IMU 数据采集系统 | QMA7981 加速度计</div>
    </div>

    <script>
        // 图表配置（暗色主题）
        const ctx = document.getElementById('imuChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'X 轴',
                        data: [],
                        borderColor: '#f87171',
                        backgroundColor: 'rgba(248,113,113,0.08)',
                        tension: 0.4,
                        fill: false,
                        pointRadius: 0,
                        borderWidth: 2
                    },
                    {
                        label: 'Y 轴',
                        data: [],
                        borderColor: '#2dd4bf',
                        backgroundColor: 'rgba(45,212,191,0.08)',
                        tension: 0.4,
                        fill: false,
                        pointRadius: 0,
                        borderWidth: 2
                    },
                    {
                        label: 'Z 轴',
                        data: [],
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96,165,250,0.08)',
                        tension: 0.4,
                        fill: false,
                        pointRadius: 0,
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: {
                        display: true,
                        grid: { color: '#1e293b' },
                        ticks: { color: '#64748b', maxTicksLimit: 8, font: { size: 10 } }
                    },
                    y: {
                        display: true,
                        grid: { color: '#1e293b' },
                        ticks: { color: '#64748b', font: { size: 10 } }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: { color: '#94a3b8', font: { size: 11 }, usePointStyle: true, pointStyle: 'line' }
                    }
                }
            }
        });

        let autoRefresh = false;
        let refreshInterval = null;
        let dataCount = 0;
        let lastTimestamp = 0;

        // 更新实时数据
        async function updateData() {
            try {
                const response = await fetch('/api/imu/latest');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('ax-value').textContent = data.ax.toFixed(4);
                    document.getElementById('ay-value').textContent = data.ay.toFixed(4);
                    document.getElementById('az-value').textContent = data.az.toFixed(4);
                    document.getElementById('update-time').textContent = data.created_at;
                    document.getElementById('status').innerHTML = '<span class="status-dot"></span>已连接';
                    document.getElementById('status').className = 'status connected';

                    const timeLabel = new Date(data.timestamp * 1000).toLocaleTimeString();
                    chart.data.labels.push(timeLabel);
                    chart.data.datasets[0].data.push(data.ax);
                    chart.data.datasets[1].data.push(data.ay);
                    chart.data.datasets[2].data.push(data.az);

                    if (chart.data.labels.length > 50) {
                        chart.data.labels.shift();
                        chart.data.datasets.forEach(ds => ds.data.shift());
                    }
                    chart.update();

                    if (lastTimestamp > 0) {
                        const deltaTime = data.timestamp - lastTimestamp;
                        if (deltaTime > 0) {
                            document.getElementById('sample-rate').innerHTML = (1000000 / deltaTime).toFixed(1) + ' <small style="font-size:0.6em;color:#64748b;">Hz</small>';
                        }
                    }
                    lastTimestamp = data.timestamp;
                    dataCount++;
                } else {
                    document.getElementById('status').innerHTML = '<span class="status-dot"></span>未连接';
                    document.getElementById('status').className = 'status disconnected';
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                document.getElementById('status').innerHTML = '<span class="status-dot"></span>错误';
                document.getElementById('status').className = 'status disconnected';
            }
        }

        // 更新统计
        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('total-records').textContent = stats.total_records;
                    document.getElementById('latest-time').textContent = stats.latest_record || '--';
                }
            } catch (error) {
                console.error('获取统计失败:', error);
            }
        }

        // 切换自动刷新
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            document.getElementById('refreshBtn').textContent = autoRefresh ? '停止刷新' : '自动刷新';
            if (autoRefresh) {
                refreshInterval = setInterval(() => { updateData(); updateStats(); }, 1000);
            } else {
                if (refreshInterval) clearInterval(refreshInterval);
            }
        }

        // 清空图表
        function clearChart() {
            chart.data.labels = [];
            chart.data.datasets.forEach(ds => ds.data = []);
            chart.update();
        }

        // 初始加载
        updateData();
        updateStats();
        updateTaskList();
        updateHelpList();
        setInterval(updateStats, 5000);
        setInterval(updateTaskList, 2000);
        setInterval(updateHelpList, 2000);

        // 远程采集
        async function collectOnce() {
            try {
                const resp = await fetch('/api/collect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({sensor: 'imu'})
                });
                if (resp.ok) {
                    const result = await resp.json();
                    pollTaskStatus(result.request_id);
                } else { alert('创建任务失败'); }
            } catch (e) { console.error('采集请求失败:', e); alert('网络错误'); }
        }

        function pollTaskStatus(requestId) {
            let attempts = 0;
            const timer = setInterval(async () => {
                attempts++;
                try {
                    const resp = await fetch(`/api/collect/${requestId}`);
                    if (resp.ok) {
                        const task = await resp.json();
                        updateTaskList();
                        if (['completed', 'failed', 'timeout'].includes(task.status)) {
                            clearInterval(timer);
                            if (task.status === 'completed' && task.data) {
                                chart.data.labels.push(new Date().toLocaleTimeString() + ' (采集)');
                                chart.data.datasets[0].data.push(task.data.ax);
                                chart.data.datasets[1].data.push(task.data.ay);
                                chart.data.datasets[2].data.push(task.data.az);
                                if (chart.data.labels.length > 50) {
                                    chart.data.labels.shift();
                                    chart.data.datasets.forEach(ds => ds.data.shift());
                                }
                                chart.update();
                            }
                        }
                    }
                } catch (e) { console.error('轮询失败:', e); }
                if (attempts >= 20) clearInterval(timer);
            }, 1000);
        }

        async function refreshHistory() { await updateData(); updateTaskList(); }

        // 更新任务列表
        async function updateTaskList() {
            try {
                const resp = await fetch('/api/tasks?limit=10');
                if (resp.ok) {
                    const result = await resp.json();
                    const container = document.getElementById('task-list');
                    if (result.tasks.length === 0) { container.innerHTML = '<div class="empty-text">暂无任务</div>'; return; }
                    const statusIcon = {'pending':'⏳','sent':'','received':'📥','completed':'✅','failed':'❌','timeout':'⏰'};
                    let html = '';
                    result.tasks.forEach(t => {
                        const time = t.created_at ? new Date(t.created_at * 1000).toLocaleTimeString() : '--';
                        const dataStr = t.status === 'completed' ? '已回传' : (t.error_msg || '--');
                        html += `<div class="list-item">`;
                        html += `<div class="item-info"><div class="item-main">${statusIcon[t.status]||'?'} ${t.request_id}</div>`;
                        html += `<div class="item-meta">${t.sensor} | ${time} | ${dataStr}</div></div>`;
                        html += `<span class="status-badge badge-${t.status}">${t.status}</span>`;
                        html += `</div>`;
                    });
                    container.innerHTML = html;
                }
            } catch (e) { console.error('获取任务列表失败:', e); }
        }

        // 求助请求
        async function updateHelpList() {
            try {
                const resp = await fetch('/api/help');
                if (resp.ok) {
                    const result = await resp.json();
                    const container = document.getElementById('help-list');
                    const requests = result.help_requests || result.requests || [];
                    if (requests.length === 0) { container.innerHTML = '<div class="empty-text">暂无求助请求</div>'; return; }
                    const statusText = {'pending':'等待回应','responded':'已回应','cancelled':'已取消'};
                    const badgeClass = {'pending':'badge-pending','responded':'badge-responded','cancelled':'badge-cancelled'};
                    let html = '';
                    requests.forEach(req => {
                        const time = req.created_at ? new Date(req.created_at * 1000).toLocaleString() : '--';
                        html += `<div class="list-item">`;
                        html += `<div class="item-info"><div class="item-main">${req.message}</div>`;
                        html += `<div class="item-meta">${req.device_id||'未知'} | ${time}</div>`;
                        if (req.status === 'responded' && req.response_msg) {
                            html += `<div class="item-meta" style="color:#6ee7b7;">回应: ${req.response_msg}</div>`;
                        }
                        html += `</div><div class="item-actions">`;
                        html += `<span class="status-badge ${badgeClass[req.status]||''}">${statusText[req.status]||req.status}</span>`;
                        if (req.status === 'pending') {
                            html += `<button class="btn-success" onclick="respondHelp('${req.request_id}')">回应</button>`;
                            html += `<button class="btn-danger" onclick="cancelHelp('${req.request_id}')">取消</button>`;
                        }
                        html += `</div></div>`;
                    });
                    container.innerHTML = html;
                }
            } catch (e) { console.error('获取求助列表失败:', e); }
        }

        async function respondHelp(requestId) {
            const msg = prompt('请输入回应内容:', '收到，马上来！');
            if (msg === null) return;
            try {
                const resp = await fetch(`/api/help/${requestId}/respond`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg})
                });
                if (resp.ok) { alert('已回应'); updateHelpList(); } else { alert('回应失败'); }
            } catch (e) { console.error('回应失败:', e); alert('网络错误'); }
        }

        async function cancelHelp(requestId) {
            if (!confirm('确定要取消此求助请求吗？')) return;
            try {
                const resp = await fetch(`/api/help/${requestId}/cancel`, { method: 'POST', headers: {'Content-Type': 'application/json'} });
                if (resp.ok) { alert('已取消'); updateHelpList(); } else { alert('取消失败'); }
            } catch (e) { console.error('取消失败:', e); alert('网络错误'); }
        }

        // 自然语言助手
        function quickNl(text) { document.getElementById('nl-input').value = text; sendNlQuery(); }

        function addNlMessage(text, type, meta) {
            const box = document.getElementById('nl-chat-box');
            const div = document.createElement('div');
            div.className = `nl-message ${type}`;
            div.innerHTML = text + (meta ? `<div class="meta">${meta}</div>` : '');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendNlQuery() {
            const input = document.getElementById('nl-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addNlMessage(text, 'user');
            try {
                const resp = await fetch('/api/nl_query', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: text})
                });
                if (resp.ok) {
                    const result = await resp.json();
                    let msg = result.message || '未知结果';
                    if (result.data) {
                        const d = result.data;
                        msg += `<br>ax=${d.ax?.toFixed(4) ?? '--'}, ay=${d.ay?.toFixed(4) ?? '--'}, az=${d.az?.toFixed(4) ?? '--'}`;
                        if (d.timestamp) msg += `<br>时间戳: ${new Date(d.timestamp * 1000).toLocaleString()}`;
                        if (d.created_at) msg += `<br>入库时间: ${d.created_at}`;
                    }
                    const sourceText = {'database':'数据库','device':'设备实时采集','timeout':'超时','intent_classifier':'意图识别'};
                    const intentText = {'query_last':'查询上次','collect_new':'重新采集','ambiguous':'意图模糊','out_of_scope':'超出范围'};
                    addNlMessage(msg, result.success ? 'assistant' : 'error',
                        `来源: ${sourceText[result.source]||result.source||'未知'} | 意图: ${intentText[result.intent]||result.intent} | ${result.intent_source === 'llm' ? 'LLM' : '规则'}`);
                    if (result.success && result.source === 'device' && result.data) {
                        chart.data.labels.push(new Date().toLocaleTimeString() + ' (NL)');
                        chart.data.datasets[0].data.push(result.data.ax);
                        chart.data.datasets[1].data.push(result.data.ay);
                        chart.data.datasets[2].data.push(result.data.az);
                        if (chart.data.labels.length > 50) { chart.data.labels.shift(); chart.data.datasets.forEach(ds => ds.data.shift()); }
                        chart.update();
                    }
                } else { const err = await resp.json(); addNlMessage(err.error || '请求失败', 'error'); }
            } catch (e) { console.error('NL 查询失败:', e); addNlMessage('网络错误', 'error'); }
        }
    </script>
</body>
</html>
